<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valheim Forge</title>
<meta name="description" content="What the Forge of Potential will do with your item: every upcoming roll read from your character save, with icons, per-level stats, costs and comparisons.">
<link rel="icon" href="ui/mapicon_upgradestation.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Forge of Potential</h1>
  <p>Every upcoming roll for your character, read from your save. Nothing is uploaded.</p>
  <p id="error" class="status warn" hidden></p>
</header>

<main>
<aside>
<section id="character" class="card">
  <h2>Character</h2>
  <div id="charbox" class="charbox" title="Type the name, or drop the .fch here: Steam\userdata\<id>\892970\remote\characters\<name>.fch, else AppData\LocalLow\IronGate\Valheim\characters_local. Quit to the main menu first so the game writes it.">
    <input id="name" type="text" placeholder="character name, or drop a .fch" autocomplete="off" spellcheck="false">
    <button id="load" type="button">Load .fch</button>
    <button id="forget" type="button" hidden>Forget</button>
    <input id="file" type="file" accept=".fch,.old,application/octet-stream" hidden>
  </div>
  <p id="file-status" class="status" hidden></p>
  <div id="inventory"></div>
</section>

<section class="card">
  <h2>Item <span id="picker-count"></span></h2>
  <div class="list-head">
    <input id="search" type="search" placeholder="search…" autocomplete="off">
    <select id="category">
      <option value="all">all</option>
      <option value="weapons">weapons &amp; ammo</option>
      <option value="armor">armor &amp; trinkets</option>
      <option value="shields">shields</option>
      <option value="other">other</option>
    </select>
  </div>
  <div class="inner"><div id="picker" class="list"></div></div>
</section>
</aside>

<div class="content">
<section id="item" class="card" hidden>
  <div id="item-head" class="head"></div>
  <div class="row controls">
    <label>Level <input id="level" type="number" min="1" max="99" value="1"></label>
    <label>Steps <select id="steps"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></label>
    <label>Results <select id="results"><option value="1">next</option><option value="2">next two</option><option value="3">next three</option></select></label>
  </div>
  <h3>Upcoming attempts</h3>
  <div id="oracle"></div>
  <h3>Plan</h3>
  <div class="row controls cmp-row">
    <label>To level <input id="plan-to" type="number" min="2" max="99" value="8"></label>
    <label>Names <select id="find-len"><option value="3">3 letters</option><option value="4" selected>3–4 letters</option><option value="5">3–5 letters (slow)</option></select></label>
    <button id="find" title="work it out again">Rerun</button>
  </div>
  <div id="plan"></div>
  <h3>Stats by level</h3>
  <div id="stats"></div>
  <h3>Compare with</h3>
  <div class="row controls cmp-row">
    <input id="cmp-search" type="search" placeholder="another item…" autocomplete="off">
    <label>Level <input id="cmp-level" type="number" min="1" max="99" value="1" hidden></label>
    <button id="cmp-clear" hidden>Clear</button>
  </div>
  <div id="cmp-list" class="chips"></div>
  <div id="cmp-table"></div>
</section>

<section id="placeholder" class="card">
  <p class="muted">Pick an item.</p>
</section>

<footer>
  <span id="game-version"></span> · numbers and icons from the game's own code and data · after <a href="https://github.com/papptimus/Forge-Oracle">Forge Oracle</a> · unofficial
</footer>
</div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
